<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Creative Navbar — TTT</title>
    <link rel="stylesheet" href="style.css" />
    <style>
    
    </style>
</head>

<body>
    <div class="site">
        <header class="navbar" role="banner">
            <div class="brand">
                <div class="logo" aria-hidden="true">N</div>
                <div>
                    <div class="sitename">My blog</div>
                    <div style="font-size:12px;opacity:.7">Timothy Philip</div>
                </div>
            </div>

            <nav class="links" role="navigation" aria-label="Main">
                <button class="hamburger" aria-expanded="false" aria-controls="primaryNav" title="Menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.6"
                            stroke-linecap="round" />
                    </svg>
                </button>

                <ul id="primaryNav" class="nav-list" role="menubar">
                    <li role="none"><a role="menuitem" href="#home">Home</a></li>
                    <li role="none"><a role="menuitem" href="#work">Work</a></li>
                    <li role="none">
                        <a role="menuitem" href="#services" aria-haspopup="true">Services ▾</a>
                        <div class="dropdown" role="menu" aria-label="Services submenu">
                            <a href="#design" style="display:block;padding:8px;border-radius:8px">Design</a>
                            <a href="#dev" style="display:block;padding:8px;border-radius:8px">Development</a>
                            <a href="#ai" style="display:block;padding:8px;border-radius:8px">AI & Data</a>
                        </div>
                    </li>
                    <li role="none"><a role="menuitem" href="#about">About</a></li>
                </ul>

                <div class="search" aria-hidden="false">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    <input type="search" placeholder="Search" aria-label="Search" />
                </div>

                <button class="cta">Get Started</button>

                <div class="indicator" aria-hidden="true"></div>
            </nav>
        </header>

        <main class="demo">
            <h2 id="home">Welcome</h2>
            <p style="margin-top:10px;opacity:.9;line-height:1.6">This is a demo page showcasing a creative navigation
                bar with subtle animations, dropdowns, and mobile support. Click the links to see the active indicator
                move.</p>
        </main>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
